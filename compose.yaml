services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace/small-web-tools
      - node_modules:/workspace/small-web-tools/node_modules

volumes:
  node_modules:
