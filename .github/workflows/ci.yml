name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Weekly canary: advisories published after a branch was merged still surface
  # here even though they no longer block unrelated pull requests.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node22-compat:
    name: Verify (22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Provide CI version fallback
        shell: bash
        run: echo "VITE_APP_VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  node24-verify:
    name: Verify (24)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Provide CI version fallback
        shell: bash
        run: echo "VITE_APP_VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Full verification
        run: npm run verify

      - name: Dependency Check
        run: npm run deps:check

      - name: Dead Code Check
        run: npm run deadcode:check

      # A pull request that does not touch the dependency manifests cannot have
      # introduced an advisory, so a newly published one is reported without
      # failing an unrelated change. Dependency changes, branch pushes, and the
      # weekly schedule keep the gate blocking.
      - name: Security Audit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          blocking=true
          if [ "${GITHUB_EVENT_NAME}" = 'pull_request' ] \
            && [ -z "$(git diff --name-only "${BASE_SHA}" HEAD -- package.json package-lock.json)" ]; then
            blocking=false
          fi

          if npm run audit; then
            exit 0
          fi

          if [ "${blocking}" = true ]; then
            echo "::error::npm audit reported advisories in the dependencies this change touches."
            exit 1
          fi

          echo "::warning::npm audit reported advisories that this pull request did not introduce;"\
            "fix them in a dependency-only change."
          {
            echo '### Security audit (advisory)'
            echo
            echo 'npm audit reported advisories, but this pull request changes neither'
            echo '`package.json` nor `package-lock.json`, so the step did not fail. Resolve them'
            echo 'in a dependency-only change; the weekly scheduled run keeps them visible.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Pages/Worker Rate Limit Integration
        run: npm run platform:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests
        id: e2e
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@v7
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: playwright-report-node-24-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
